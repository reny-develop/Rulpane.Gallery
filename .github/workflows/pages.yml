# Holds the ledger to its copies, runs every release in its sample again, takes a picture of each,
# and publishes the pages.
#
# On every push to main, after a submission is recorded (submit.yml starts this), and once a
# week: Rulpane changes on its own schedule, and a change to how it reads a document could stop
# a release that passed when it was recorded. A run where that happened fails here, before
# anybody opens a link, and publishes nothing.
#
# Rulpane is checked out beside the tools, because they read a release with its code. While
# Rulpane is private that takes RULPANE_READ_TOKEN, a token that can read it.

name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: reny-develop/Rulpane
          path: rulpane
          token: ${{ secrets.RULPANE_READ_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Copy the Registry's rule sets
        run: dotnet run --project rulpane/tool/Mirror -c Release -- work/registry

      - name: Read every case a submission can be
        run: bash tool/Admit/test/run.sh

      - name: Hold the ledger to its copies, and run every release in its sample
        run: dotnet run --project tool/Admit -c Release -- check --registry work/registry

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The pictures on the pages: each release opened as its "Open it" link opens it, in a
      # Rulpane served from this runner with the Registry and this ledger beside it — what the
      # next deploy of Rulpane will serve. A picture that cannot be taken is left off its page.
      - name: Take the pictures
        run: |
          set -euo pipefail
          dotnet publish rulpane/src/Rulpane.Viewer -c Release -o work/viewer --nologo -v quiet
          rm -rf work/viewer/wwwroot/registry
          cp -r work/registry work/viewer/wwwroot/registry
          dotnet run --project rulpane/tool/Mirror -c Release -- --gallery work/viewer/wwwroot/gallery .
          python3 -m http.server 5080 --bind 127.0.0.1 -d work/viewer/wwwroot >/dev/null 2>&1 &
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:5080/ && break; sleep 1; done
          dotnet run --project tool/Site -c Release -- --shots-to-take work/shots.tsv
          node tool/Shot/shoot.mjs work/shots.tsv http://127.0.0.1:5080/ work/shots

      - name: Render the pages
        run: dotnet run --project tool/Site -c Release -- work/site --registry work/registry --shots work/shots --repository "$GITHUB_REPOSITORY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
